# SPEC 8.1 초기 Config. [초기 설정] 값은 최적값이 아니며 Ablation 대상이다.
seed: 42
device: auto
num_workers: 0
output_dir: runs

data:
  raw_dir: data/raw
  cache_dir: data/processed

cv:
  n_splits: 5
  fold: 0                          # -1 = 200개 전체 (공식 Kaggle 학습)

model:
  d_model: 128
  n_heads: 4
  head_dim: 32                     # d_model / n_heads
  d_ff: 512                        # 4 × d_model
  zone_encoder_layers: 2
  type_encoder_layers: 2
  decoder_layers: 2
  dropout: 0.1
  layer_norm: pre                  # [제안] Pre-LN 구현
  patch_size_hours: 24
  decoder_window_days: 7           # [제안] T ∈ {3, 7, 14, 28}
  id_lookup_embedding: false
  encoder_positional_encoding: false
  decoder_positional_encoding: true
  decoder_causal_mask: true
  cross_attention_fusion: parallel # [미정] parallel | sequential | gate
  exclude_target_from_peers: true  # [제안]
  # Ablation 스위치 (SPEC 9: E1–E4, 5.3 Context-only / Target-only)
  use_zone_encoder: true
  use_type_encoder: true
  share_patch_embedding: true      # [제안] Linear(24,D) 공유부터 시작
  target_input: true               # false = Context-only

pretrain:
  objective: building_id_cross_entropy
  normal_only: true
  loss_on: all_valid_days          # all_valid_days | last_day
  num_classes: auto_from_training_buildings
  min_valid_hours: 20              # 손실을 줄 날짜의 최소 정상 관측 시간 수
  val_days: 61                     # 마지막 61일(11–12월)을 ID 분류 내부 검증 기간으로 사용
  context_shuffle: false           # true = Peer를 무작위 건물로 교체 (E7)
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  batch_size: 64
  epochs: 10
  samples_per_epoch: null          # null = 전체 Window
  grad_clip: 1.0
