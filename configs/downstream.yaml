# SPEC 6.2 Hour-level Classification Head 기본선. mode 자체가 [제안]이다.
seed: 42
device: auto
num_workers: 0
output_dir: runs

data:
  raw_dir: data/raw
  cache_dir: data/processed

cv:
  n_splits: 5                      # Pretraining과 같은 Fold 분할을 써야 한다.
  fold: 0                          # -1 = 200개 학습 후 test 206개 제출 파일 생성

# init_from이 null일 때만 사용 (E5: Without ID Pretraining). 체크포인트가 있으면 그 설정을 따른다.
model:
  d_model: 128
  n_heads: 4
  d_ff: 512
  zone_encoder_layers: 2
  type_encoder_layers: 2
  decoder_layers: 2
  dropout: 0.1
  decoder_window_days: 7
  cross_attention_fusion: parallel

downstream:
  mode: supervised_hourly_head     # [제안] 아직 확정되지 않음
  init_from: runs/pretrain/fold0/best.pt
  freeze_backbone: false
  peer_pool: inductive             # [미정] inductive = 학습 건물만 Peer / transductive = 평가 건물 비라벨 측정값도 Peer
  output_hours_per_day: 24
  loss_on: all_days                # all_days | last_day
  pos_weight: auto                 # auto = 음성/양성 비율, null = 가중치 없음
  threshold: 0.5                   # F1/Precision/Recall용 고정 임계값 (검증 정답으로 튜닝하지 않음)
  metric_primary: roc_auc          # Kaggle 공식 지표
  metrics_secondary: [f1, precision, recall, pr_auc]
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 64
  epochs: 5
  samples_per_epoch: null
  grad_clip: 1.0
